<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="のぶ帳簿"><link rel="manifest" href="manifest.webmanifest"><title>のぶ帳簿</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}main{max-width:720px;margin:auto;padding:16px 14px 48px}.head{text-align:center}.head h1{margin:8px 0 3px;font-size:24px}.head p{margin:0 0 12px;color:#6b7280;font-size:12px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0001}.camera{display:block;text-align:center;padding:25px 14px;border:2px dashed #9ca3af;border-radius:16px;background:#fafafa;font-size:19px;font-weight:800}.camera input{display:none}#preview{display:none;width:100%;max-height:360px;object-fit:contain;border-radius:14px;margin-top:12px}.status{font-size:13px;background:#f3f4f6;border-radius:11px;padding:11px;margin-top:11px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:16px}.row,.actions,.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:800;background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.sum{background:#f3f4f6;padding:13px;border-radius:13px}.sum small{color:#6b7280}.sum b{display:block;font-size:21px;margin-top:3px}.entry{padding:11px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:12px}.sub{font-size:12px;color:#6b7280;margin-top:3px}#editor{display:none}</style></head><body><main><div class="head"><h1>🧾 のぶ帳簿</h1><p>iPhone用・撮影 → OCR → 帳簿</p></div><section class="card"><label class="camera">📷 レシート・領収書を撮影<input id="camera" type="file" accept="image/*" capture="environment"></label><div id="status" class="status">タップするとiPhoneの背面カメラを呼び出します。</div><img id="preview"></section><section class="card" id="editor"><h2>読み取り結果</h2><div id="ocr" class="status">OCR準備中…</div><div class="field"><label>分類</label><select id="kind"><option>買い物</option><option>医療費</option><option>薬局</option><option>通院交通費</option><option>仕事関連</option><option>車</option><option>源泉徴収票</option><option>その他</option></select></div><div class="row"><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>金額</label><input id="amount" type="number" inputmode="numeric"></div></div><div class="field"><label>店名・医療機関名</label><input id="name"></div><div class="field"><label>メモ</label><input id="memo"></div><div class="actions"><button id="save">保存</button><button class="secondary" id="retake">撮り直す</button></div></section><section class="card"><h2>集計</h2><div class="summary"><div class="sum"><small>今月</small><b id="month">¥0</b></div><div class="sum"><small>今年</small><b id="year">¥0</b></div></div><p id="medical">今年の医療費関連：¥0</p></section><section class="card"><h2>最近の帳簿</h2><div id="list">まだ登録がありません</div></section></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const K="nobu-receipt-v1",$=id=>document.getElementById(id);let records=JSON.parse(localStorage.getItem(K)||"[]");$("date").value=new Date().toISOString().slice(0,10);function yen(n){return"¥"+Number(n||0).toLocaleString("ja-JP")}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function render(){let d=new Date(),ym=d.toISOString().slice(0,7),y=""+d.getFullYear();$("month").textContent=yen(records.filter(r=>r.date?.startsWith(ym)).reduce((a,r)=>a+Number(r.amount||0),0));$("year").textContent=yen(records.filter(r=>r.date?.startsWith(y)).reduce((a,r)=>a+Number(r.amount||0),0));$("medical").textContent="今年の医療費関連："+yen(records.filter(r=>r.date?.startsWith(y)&&["医療費","薬局","通院交通費"].includes(r.kind)).reduce((a,r)=>a+Number(r.amount||0),0));$("list").innerHTML=records.slice().reverse().slice(0,30).map(r=>`<div class="entry"><div><b>${esc(r.name||"名称未入力")}</b><div class="sub">${esc(r.date)} ・ ${esc(r.kind)}</div></div><b>${yen(r.amount)}</b></div>`).join("")||"まだ登録がありません"}function parse(t){let d=t.match(/(20\d{2})\s*[\/-年]\s*(\d{1,2})\s*[\/-月]\s*(\d{1,2})日?/);if(d)$("date").value=`${d[1]}-${String(d[2]).padStart(2,"0")}-${String(d[3]).padStart(2,"0")}`;let a=[];for(let l of t.split(/\n/)){if(/合計|税込|総額|お会計|領収|total/i.test(l))for(let n of l.match(/[¥￥]?\s*[\d,]+/g)||[]){let v=+n.replace(/[^\d]/g,"");if(v>0&&v<1e8)a.push(v)}}if(!a.length)for(let n of t.match(/[¥￥]?\s*[\d,]+/g)||[]){let v=+n.replace(/[^\d]/g,"");if(v>0&&v<1e8)a.push(v)}if(a.length)$("amount").value=Math.max(...a);let lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean),bad=/^(合計|小計|税込|税|お預り|お釣り|領収書|レシート|商品|数量|単価|電話|TEL)/i,n=lines.find(x=>/[ぁ-んァ-ン一-龠A-Za-z]/.test(x)&&!bad.test(x)&&x.length>=2&&x.length<=40);if(n)$("name").value=n}async function ocr(file){$("ocr").textContent="OCRエンジンを準備中…";try{let w=await Tesseract.createWorker("jpn+eng",1,{logger:m=>{if(m.status==="recognizing text")$("ocr").textContent="OCR中… "+Math.round((m.progress||0)*100)+"%"}});let r=await w.recognize(file);await w.terminate();parse(r.data.text||"");$("ocr").textContent="OCR完了。内容を確認して保存してください。"}catch(e){console.error(e);$("ocr").textContent="OCRに失敗しました。画像は取り込めていますので手入力できます。"}}$("camera").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;$("editor").style.display="block";$("preview").src=URL.createObjectURL(f);$("preview").style.display="block";await ocr(f)};$("retake").onclick=()=>{$("camera").value="";$ ("camera").click()};$("save").onclick=()=>{let a=+$ ("amount").value;if(!a)return alert("金額を入力してください");records.push({date:$ ("date").value,kind:$ ("kind").value,amount:a,name:$ ("name").value,memo:$ ("memo").value});localStorage.setItem(K,JSON.stringify(records));render();alert("保存しました");location.reload()};render();</script></body></html>
