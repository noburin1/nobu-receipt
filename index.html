<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="./manifest.webmanifest">
<title>のぶ帳簿 FREE</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--good:#059669;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:16px 14px 110px}
h1{font-size:27px;margin:5px 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
button{appearance:none;border:0;border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px}
.primary{background:var(--accent);color:#fff}.secondary{background:#eef2ff;color:#1e3a8a}.danger{background:#fee2e2;color:#991b1b}
input,select,textarea{width:100%;font-size:16px;padding:11px 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff}
label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:10px 0 5px}
#preview{width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:#111827;margin-top:10px;display:none}
.status{font-size:13px;margin-top:10px;padding:10px 12px;border-radius:10px;background:#f9fafb;border:1px solid var(--line);white-space:pre-wrap}
.good{color:var(--good)}.bad{color:var(--bad)}.hidden{display:none}
.stat{font-size:12px;color:var(--muted)}.money{font-size:24px;font-weight:800;margin-top:2px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:3px}.tab{white-space:nowrap;background:#e5e7eb;color:#374151}.tab.active{background:#111827;color:#fff}
.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}.itemtop{display:flex;justify-content:space-between;gap:8px}
.itemname{font-weight:800}.itemmeta{font-size:12px;color:var(--muted);margin-top:3px}.itemamount{font-weight:800;white-space:nowrap}
.small{font-size:12px}.ocr{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:12px;background:#f9fafb;padding:10px;border-radius:10px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:700;margin-top:6px}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:5}
footer .inner{max-width:760px;margin:auto;display:flex;gap:10px}footer button{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>のぶ帳簿</h1>
<div class="sub">無料・カード不要・APIキー不要。OCRはiPhoneのブラウザ内で実行します。</div>
<div class="badge">端末内OCR / PaddleOCR PP-OCRv5 日本語</div>

<div class="card">
  <div class="tabs">
    <button class="tab active" data-type="shopping">買い物</button>
    <button class="tab" data-type="medical">医療費</button>
    <button class="tab" data-type="withholding">源泉徴収票</button>
  </div>
  <label>写真を選ぶ</label>
  <input id="photoLibrary" type="file" accept="image/*">
  <div class="cameraBox" style="margin-top:10px;position:relative">
    <div class="primary" style="text-align:center;border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px">📷 カメラで撮影</div>
    <input id="cameraInput" type="file" accept="image/*" capture="environment"
      aria-label="カメラでレシートを撮影"
      style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer">
  </div>
  <img id="preview" alt="preview">
  <button id="ocrBtn" class="primary" style="width:100%;margin-top:10px">OCRして自動入力</button>
  <div id="status" class="status">写真を選んでください。カメラは青い「カメラで撮影」または下部の「レシート撮影」を直接タップしてください。初回OCRのみモデル読み込みがあります。</div>
</div>

<div class="card">
  <div id="shoppingFields">
    <div class="row"><div><label>日付</label><input id="date" type="date"></div><div><label>金額</label><input id="amount" inputmode="numeric" placeholder="0"></div></div>
    <label>店舗名</label><input id="merchant" placeholder="例：原信">
    <label>カテゴリ</label><select id="category"><option>食費</option><option>日用品</option><option>衣類</option><option>交通費</option><option>その他</option></select>
  </div>
  <div id="medicalFields" class="hidden">
    <div class="row"><div><label>受診日</label><input id="medDate" type="date"></div><div><label>支払額</label><input id="medAmount" inputmode="numeric" placeholder="0"></div></div>
    <label>医療機関・薬局</label><input id="medicalName" placeholder="例：○○歯科">
    <label>区分</label><select id="medicalKind"><option>病院・診療所</option><option>歯科</option><option>薬局</option><option>その他医療費</option></select>
  </div>
  <div id="withholdingFields" class="hidden">
    <label>支払者</label><input id="payer" placeholder="会社名">
    <div class="row"><div><label>年</label><input id="taxYear" inputmode="numeric" placeholder="2026"></div><div><label>支払金額</label><input id="grossPay" inputmode="numeric" placeholder="0"></div></div>
    <div class="row"><div><label>源泉徴収税額</label><input id="withheldTax" inputmode="numeric" placeholder="0"></div><div><label>社会保険料等</label><input id="socialInsurance" inputmode="numeric" placeholder="0"></div></div>
  </div>
  <label>メモ</label><textarea id="memo" rows="2"></textarea>
  <div class="row" style="margin-top:12px"><button id="saveBtn" class="secondary">保存</button><button id="clearBtn" class="danger">入力クリア</button></div>
</div>

<div class="card"><div class="row"><div><div class="stat">今月の買い物</div><div id="monthTotal" class="money">¥0</div></div><div><div class="stat">今年の医療費</div><div id="medicalTotal" class="money">¥0</div></div></div></div>

<div class="card">
  <div class="row"><strong>登録履歴</strong><select id="filter"><option value="all">すべて</option><option value="shopping">買い物</option><option value="medical">医療費</option><option value="withholding">源泉徴収票</option></select></div>
  <div id="list"></div>
</div>

<div class="card">
  <button id="exportBtn" class="secondary" style="width:100%">CSVを書き出す</button>
  <details style="margin-top:12px"><summary class="small">OCR原文を確認</summary><div id="ocrText" class="ocr"></div></details>
</div>
</div>

<footer><div class="inner" style="position:relative">
  <div class="primary" style="flex:1;text-align:center;border-radius:12px;padding:13px 14px;font-weight:700;font-size:16px">📷 レシート撮影</div>
  <input id="cameraFooterInput" type="file" accept="image/*" capture="environment"
    aria-label="レシートを撮影"
    style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer">
</div></footer>

<script type="module">
import { PaddleOCR } from "https://esm.sh/@paddleocr/paddleocr-js@latest?bundle";

const STORAGE_KEY="nobu-receipt-v3";
let type="shopping",sourceFile=null,lastOcr="",ocrEngine=null;
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(Number(n||0));
const nums=s=>Number(String(s||"").replace(/[^\d]/g,"")||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch{return[]}}
function store(v){localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}
function setStatus(msg,kind=""){const e=$("status");e.textContent=msg;e.className="status "+kind}
function isoDate(y,m,d){return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`}

async function getEngine(){
  if(ocrEngine)return ocrEngine;
  setStatus("無料OCRモデルを読み込み中…\n初回だけ少し時間がかかります。");
  ocrEngine=await PaddleOCR.create({
    lang:"japan",
    ocrVersion:"PP-OCRv5",
    ortOptions:{
      backend:"wasm",
      wasmPaths:"https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/",
      numThreads:1,
      simd:true
    }
  });
  return ocrEngine;
}

async function fileToImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    return img;
  } finally { /* URL is revoked after canvas creation by caller */ }
}

function makeCanvas(img,deg=0){
  const rad=deg*Math.PI/180, swap=deg%180!==0;
  const max=1500;
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  const scale=Math.min(1,max/Math.max(iw,ih));
  const w=Math.round(iw*scale),h=Math.round(ih*scale);
  const c=document.createElement("canvas");
  c.width=swap?h:w;c.height=swap?w:h;
  const x=c.getContext("2d",{willReadFrequently:true});
  x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2,c.height/2);x.rotate(rad);x.drawImage(img,-w/2,-h/2,w,h);
  return c;
}

function textFromResult(result){
  const items=(result?.items||[]).filter(x=>x?.text&&Number(x.score??1)>=0.35);
  items.sort((a,b)=>{
    const ay=Math.min(...(a.poly||[[0,0]]).map(p=>p[1]||0)), by=Math.min(...(b.poly||[[0,0]]).map(p=>p[1]||0));
    if(Math.abs(ay-by)>18)return ay-by;
    const ax=Math.min(...(a.poly||[[0,0]]).map(p=>p[0]||0)), bx=Math.min(...(b.poly||[[0,0]]).map(p=>p[0]||0));
    return ax-bx;
  });
  return items.map(x=>x.text.trim()).filter(Boolean).join("\n");
}

function orientationScore(text){
  let s=Math.min(text.length,500)/20;
  const keys=["領収","請求","合計","支払","円","歯科","病院","薬局","令和","年","月","日","点","負担","金額","診療","源泉徴収","社会保険"];
  for(const k of keys)if(text.includes(k))s+=8;
  s+=(text.match(/[ぁ-んァ-ヶ一-龯]/g)||[]).length/8;
  return s;
}

async function runOCR(file){
  const engine=await getEngine();
  const img=await fileToImage(file);
  const candidates=[0,90,270,180];
  let best={text:"",score:-1,deg:0};
  for(let i=0;i<candidates.length;i++){
    const deg=candidates[i];
    setStatus(`OCR中… 自動向き判定 ${i+1}/${candidates.length}`);
    const canvas=makeCanvas(img,deg);
    const [result]=await engine.predict(canvas,{
      textDetLimitSideLen:960,
      textDetMaxSideLimit:1600,
      textRecScoreThresh:0.35
    });
    const text=textFromResult(result),score=orientationScore(text);
    if(score>best.score)best={text,score,deg};
    if(score>=42 && /[円￥¥]|合計|領収|支払/.test(text))break;
    await new Promise(r=>setTimeout(r,30));
  }
  URL.revokeObjectURL(img.src);
  if(!best.text.trim())throw new Error("文字を読み取れませんでした。写真を近づけて撮影してください。");
  return best;
}

function parseDate(t){
  let m=t.match(/(?:令和|R)\s*(\d{1,2})\s*年?\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/i);
  if(m)return isoDate(2018+Number(m[1]),m[2],m[3]);
  m=t.match(/(20\d{2})[\/.\-年]\s*(\d{1,2})[\/.\-月]\s*(\d{1,2})日?/);
  return m?isoDate(m[1],m[2],m[3]):"";
}
function parseName(t){
  const lines=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const preferred=lines.filter(s=>/(歯科|医院|クリニック|病院|薬局|ストア|スーパー|店|マート)/.test(s) && s.length<=40);
  return preferred.sort((a,b)=>a.length-b.length)[0] || lines.find(s=>s.length>=2&&s.length<=28&&!/\d{3,}/.test(s)) || "";
}
function parseAmount(t){
  const lines=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const candidates=[];
  const moneyRe=/(?:[￥¥]\s*)?([0-9]{1,3}(?:[,，][0-9]{3})+|[0-9]{2,7})\s*(?:円)?/g;
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(/点|負担割合|上限|No\.?|番号|電話|TEL|保険者|記号|患者番号/i.test(line))continue;
    let base=0;
    if(/領収金額|領収額|お支払|支払額|患者負担|自己負担|合計|総額|請求額|現計|TOTAL/i.test(line))base+=100;
    if(/円|￥|¥/.test(line))base+=25;
    if(i>=Math.floor(lines.length*.55))base+=8;
    for(const m of line.matchAll(moneyRe)){
      const v=Number(m[1].replace(/[,，]/g,""));
      if(v<=0||v>=10000000)continue;
      let score=base;
      if(v>=100)score+=12;
      if(v%10===0)score+=2;
      if(v<=99)score-=20;
      candidates.push({v,score,line,i});
    }
  }
  candidates.sort((a,b)=>b.score-a.score || b.i-a.i || b.v-a.v);
  return candidates[0]?.v||0;
}
function parseWithholding(t){
  const grab=(label)=>{
    const lines=t.split(/\n/);
    for(let i=0;i<lines.length;i++){
      if(lines[i].includes(label)){
        const chunk=lines.slice(i,i+3).join(" ");
        const m=chunk.match(/([0-9]{1,3}(?:[,，][0-9]{3})+|[0-9]{4,10})/);
        if(m)return nums(m[1]);
      }
    }
    return 0;
  };
  const y=(t.match(/(20\d{2})\s*年/)||[])[1]||"";
  return {year:y,gross:grab("支払金額"),tax:grab("源泉徴収税額"),social:grab("社会保険料")};
}

function handleSelectedFile(f){
  if(!f)return;
  sourceFile=f;
  const u=URL.createObjectURL(f);
  $("preview").src=u;
  $("preview").style.display="block";
  setStatus("撮影/選択できました。OCRできます。","good");
}
$("photoLibrary").addEventListener("change",e=>handleSelectedFile(e.target.files?.[0]));
$("cameraInput").addEventListener("change",e=>handleSelectedFile(e.target.files?.[0]));
$("cameraFooterInput").addEventListener("change",e=>handleSelectedFile(e.target.files?.[0]));

$("ocrBtn").onclick=async()=>{
  if(!sourceFile){setStatus("先に写真を選んでください。","bad");return}
  $("ocrBtn").disabled=true;
  try{
    const best=await runOCR(sourceFile);
    const text=best.text;lastOcr=text;$("ocrText").textContent=text;
    const d=parseDate(text),n=parseName(text),a=parseAmount(text);
    if(type==="shopping"){if(d)$("date").value=d;if(n)$("merchant").value=n;if(a)$("amount").value=a}
    if(type==="medical"){if(d)$("medDate").value=d;if(n)$("medicalName").value=n;if(a)$("medAmount").value=a;if(/歯科/.test(text))$("medicalKind").value="歯科";else if(/薬局|調剤/.test(text))$("medicalKind").value="薬局"}
    if(type==="withholding"){const w=parseWithholding(text);if(w.year)$("taxYear").value=w.year;if(w.gross)$("grossPay").value=w.gross;if(w.tax)$("withheldTax").value=w.tax;if(w.social)$("socialInsurance").value=w.social;if(n)$("payer").value=n}
    setStatus(`OCR完了（自動回転 ${best.deg}°）。内容を確認して保存してください。`,"good");
  }catch(e){
    setStatus("OCR失敗: "+String(e?.message||e),"bad");
  }finally{$("ocrBtn").disabled=false}
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");type=b.dataset.type;
  $("shoppingFields").classList.toggle("hidden",type!=="shopping");$("medicalFields").classList.toggle("hidden",type!=="medical");$("withholdingFields").classList.toggle("hidden",type!=="withholding");
});

function clearInputs(){
  ["date","amount","merchant","medDate","medAmount","medicalName","payer","taxYear","grossPay","withheldTax","socialInsurance","memo"].forEach(id=>$(id).value="");
  $("photoLibrary").value="";$("cameraInput").value="";$("cameraFooterInput").value="";
  $("preview").style.display="none";sourceFile=null;lastOcr="";$("ocrText").textContent="";
}
$("clearBtn").onclick=()=>{clearInputs();setStatus("入力をクリアしました。")};

$("saveBtn").onclick=()=>{
  const rec={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),type,createdAt:new Date().toISOString(),memo:$("memo").value,ocr:lastOcr};
  if(type==="shopping")Object.assign(rec,{date:$("date").value,amount:nums($("amount").value),name:$("merchant").value,category:$("category").value});
  if(type==="medical")Object.assign(rec,{date:$("medDate").value,amount:nums($("medAmount").value),name:$("medicalName").value,category:$("medicalKind").value});
  if(type==="withholding")Object.assign(rec,{year:$("taxYear").value,name:$("payer").value,grossPay:nums($("grossPay").value),withheldTax:nums($("withheldTax").value),socialInsurance:nums($("socialInsurance").value)});
  if(type!=="withholding"&&(!rec.date||!rec.amount)){setStatus("日付と金額を確認してください。","bad");return}
  const data=load();data.unshift(rec);store(data);render();clearInputs();setStatus("保存しました。","good");
};

function render(){
  const data=load(),f=$("filter").value,show=f==="all"?data:data.filter(x=>x.type===f);
  const now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;
  $("monthTotal").textContent=yen(data.filter(x=>x.type==="shopping"&&String(x.date||"").startsWith(ym)).reduce((s,x)=>s+Number(x.amount||0),0));
  $("medicalTotal").textContent=yen(data.filter(x=>x.type==="medical"&&String(x.date||"").startsWith(String(now.getFullYear()))).reduce((s,x)=>s+Number(x.amount||0),0));
  $("list").innerHTML=show.length?show.map(x=>{
    const label=x.type==="medical"?"医療費":x.type==="withholding"?"源泉徴収票":"買い物";
    const amount=x.type==="withholding"?x.grossPay:x.amount;const date=x.type==="withholding"?(x.year?x.year+"年":""):(x.date||"");
    return `<div class="item"><div class="itemtop"><div><div class="itemname">${esc(x.name||"名称未入力")}</div><div class="itemmeta">${label}・${esc(date)}${x.category?"・"+esc(x.category):""}</div></div><div class="itemamount">${yen(amount)}</div></div>${x.memo?`<div class="itemmeta">${esc(x.memo)}</div>`:""}<button class="danger small" style="margin-top:8px;padding:7px 10px" data-del="${esc(x.id)}">削除</button></div>`;
  }).join(""):`<div class="itemmeta" style="padding:18px 0">まだ登録がありません。</div>`;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("この記録を削除しますか？")){store(load().filter(x=>x.id!==b.dataset.del));render()}});
}
$("filter").onchange=render;

$("exportBtn").onclick=()=>{
  const rows=[["種別","日付/年","名称","カテゴリ","金額/支払金額","源泉徴収税額","社会保険料等","メモ"]];
  for(const x of load())rows.push([x.type,x.date||x.year||"",x.name||"",x.category||"",x.amount||x.grossPay||0,x.withheldTax||0,x.socialInsurance||0,x.memo||""]);
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=`nobu-chobo-${new Date().toISOString().slice(0,10)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js?v=10").catch(()=>{});
</script>
</body></html>
