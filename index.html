<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>のぶ帳簿 v20 店名日付精密版</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#111;background:#f5f5f7}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top) 12px calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:rgba(245,245,247,.95);backdrop-filter:blur(12px);padding:12px 0 8px;z-index:5}
h1{font-size:24px;margin:0}.ver{font-size:12px;color:#666;margin-left:6px}
.card{background:#fff;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:16px;background:#e9e9ed;color:#111}
.primary{background:#0a84ff;color:#fff}.danger{background:#ff3b30;color:#fff}
input,select,textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:16px;background:#fff}
label{display:block;font-size:13px;color:#555;margin:10px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:14px;white-space:pre-wrap;background:#f3f4f6;border-radius:10px;padding:10px;min-height:44px}
.ok{background:#eaf8ef}.err{background:#ffecec}
#preview{width:100%;max-height:360px;object-fit:contain;background:#111;border-radius:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}
.hidden{display:none!important}.small{font-size:12px;color:#666}.total{font-size:28px;font-weight:800}
.history-item{border-top:1px solid #eee;padding:10px 0}
footer{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(250,250,252,.96);backdrop-filter:blur(12px);z-index:10}
.camwrap{position:relative}.camwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.badge{display:inline-block;border-radius:999px;padding:4px 8px;background:#e9e9ed;font-size:12px;font-weight:700}
</style>
</head>
<body>
<header><h1>のぶ帳簿 <span class="ver">v20・店名日付精密版</span></h1></header>

<div class="card">
  <span id="selftest" class="badge">内部テスト中…</span><span class="badge" style="margin-left:6px">PaddleOCR不使用</span>
  <p class="small">無料・APIキー不要。OCR画像は外部APIへ送信せず、Safari内で処理します。初回のみOCRライブラリ/日本語データをCDNから取得します。</p>
</div>

<div class="card">
  <div class="tabs">
    <button id="tab-shopping">買い物</button>
    <button id="tab-medical" class="primary">医療費</button>
    <button id="tab-tax">源泉徴収票</button>
  </div>
</div>

<div class="card">
  <div class="grid2">
    <div class="camwrap"><button class="primary" style="width:100%">📷 カメラで撮影</button><input id="camera" type="file" accept="image/*" capture="environment"></div>
    <div class="camwrap"><button style="width:100%">写真を選ぶ</button><input id="picker" type="file" accept="image/*"></div>
  </div>
  <p class="small"><b>買い物レシートは、店名・日付・合計金額が全部入るようにレシート全体を撮影してください。</b></p>
  <img id="preview" class="hidden" alt="preview">
  <button id="ocrBtn" class="primary" style="width:100%;margin-top:10px" disabled>OCRして自動入力</button>
  <div id="status" class="status" style="margin-top:10px">v20安定版を読み込みました。レシート全体を撮影してください。</div>
</div>

<div id="form-medical" class="card">
  <h2>医療費</h2>
  <label>医療機関名</label><input id="m-name" placeholder="例：○○歯科">
  <label>日付</label><input id="m-date" type="date">
  <label>支払額（円）</label><input id="m-amount" inputmode="numeric" placeholder="例：370">
  <button id="saveMedical" class="primary" style="width:100%;margin-top:12px">医療費として保存</button>
</div>

<div id="form-shopping" class="card hidden">
  <h2>買い物</h2>
  <label>店名</label><input id="s-name">
  <label>日付</label><input id="s-date" type="date">
  <label>金額（円）</label><input id="s-amount" inputmode="numeric">
  <button id="saveShopping" class="primary" style="width:100%;margin-top:12px">買い物として保存</button>
</div>

<div id="form-tax" class="card hidden">
  <h2>源泉徴収票</h2>
  <label>支払者名</label><input id="t-name">
  <label>年</label><input id="t-year" inputmode="numeric">
  <label>支払金額</label><input id="t-payment" inputmode="numeric">
  <label>源泉徴収税額</label><input id="t-tax" inputmode="numeric">
  <button id="saveTax" class="primary" style="width:100%;margin-top:12px">源泉徴収票として保存</button>
</div>

<div class="card">
  <div class="grid2">
    <div><div class="small">今月の買い物</div><div id="shoppingTotal" class="total">0円</div></div>
    <div><div class="small">今年の医療費</div><div id="medicalTotal" class="total">0円</div></div>
  </div>
</div>

<div class="card">
  <div class="row">
    <select id="filter"><option value="all">全履歴</option><option value="shopping">買い物</option><option value="medical">医療費</option><option value="tax">源泉徴収票</option></select>
    <button id="csvBtn">CSV出力</button>
  </div>
  <div id="history"></div>
</div>

<details class="card"><summary>OCR原文を見る</summary><textarea id="raw" rows="14" readonly></textarea></details>

<footer>
  <div class="camwrap"><button class="primary" style="width:100%">📷 レシート撮影</button><input id="camera2" type="file" accept="image/*" capture="environment"></div>
</footer>

<script>

// Remove legacy service workers/caches from older PaddleOCR/PWA builds.
// Bookkeeping data in localStorage is intentionally preserved.
(async()=>{
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if("caches" in window){
      const names=await caches.keys();
      await Promise.all(
        names
          .filter(n=>/nobu-receipt|paddle|ocr/i.test(n))
          .map(n=>caches.delete(n))
      );
    }
  }catch(e){
    console.warn("legacy cache cleanup skipped",e);
  }
})();

const KEY="nobu-receipt-v3";
const TESS_URL="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
let db=JSON.parse(localStorage.getItem(KEY)||"[]");
let currentFile=null,currentTab="medical",worker=null,loadPromise=null;
const $=id=>document.getElementById(id);
const yen=n=>new Intl.NumberFormat("ja-JP").format(Number(n)||0)+"円";

function setStatus(msg,kind=""){
  const el=$("status"); el.textContent=msg; el.className="status"+(kind?" "+kind:"");
}
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(loadPromise)return loadPromise;
  loadPromise=new Promise((resolve,reject)=>{
    setStatus("OCRライブラリを読み込み中…");
    const s=document.createElement("script");
    s.src=TESS_URL;s.async=true;
    s.onload=()=>window.Tesseract?resolve():reject(new Error("OCRライブラリを読み込めませんでした"));
    s.onerror=()=>reject(new Error("OCRライブラリの取得に失敗しました"));
    document.head.appendChild(s);
  });
  return loadPromise;
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function setTab(tab){
  currentTab=tab;
  ["shopping","medical","tax"].forEach(x=>{
    $("form-"+x).classList.toggle("hidden",x!==tab);
    $("tab-"+x).classList.toggle("primary",x===tab);
  });
}
["shopping","medical","tax"].forEach(x=>$("tab-"+x).onclick=()=>setTab(x));

function onFile(file){
  if(!file)return;
  currentFile=file;
  $("preview").src=URL.createObjectURL(file);
  $("preview").classList.remove("hidden");
  $("ocrBtn").disabled=false;
  setStatus("写真を受け取りました。「OCRして自動入力」を押してください。");
}
["camera","picker","camera2"].forEach(id=>$(id).addEventListener("change",e=>onFile(e.target.files[0])));

function normalize(s){
  return String(s||"")
    .replace(/[，,]/g,"")
    .replace(/[￥¥]/g,"円")
    .replace(/[ＯO〇]/g,"0")
    .replace(/[ＩIl｜]/g,"1")
    .replace(/[：:]/g,":");
}
function reiwaToISO(y,m,d){
  const yy=Number(y)+2018;
  if(!yy||!m||!d)return "";
  return `${yy}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function validYMD(y,m,d){
  y=Number(y);m=Number(m);d=Number(d);
  if(y<2000||y>2099||m<1||m>12||d<1||d>31)return "";
  const dt=new Date(y,m-1,d);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return "";

  // Receipt dates should not be wildly in the future.
  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const diffDays=(dt-today)/(1000*60*60*24);
  if(diffDays>7)return "";

  // Also reject dates more than 3 years old as likely OCR noise for daily receipt capture.
  if(diffDays < -1100)return "";

  return `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function inferYearForMonthDay(m,d){
  const now=new Date();
  let y=now.getFullYear();
  let dt=new Date(y,Number(m)-1,Number(d));
  // If the inferred date is more than ~45 days in the future, it is probably last year.
  const futureDays=(dt-now)/(1000*60*60*24);
  if(futureDays>45)y--;
  return validYMD(y,m,d);
}
function parseDate(text){
  let s=normalize(text)
    .replace(/[―ーｰ]/g,"-")
    .replace(/[年月]/g,m=>m)
    .replace(/\s+/g," ");

  let m;

  // Reiwa full form
  m=s.match(/令和\s*([0-9]{1,2})\s*年\s*([0-9]{1,2})\s*月\s*([0-9]{1,2})\s*日/);
  if(m)return reiwaToISO(m[1],m[2],m[3]);

  // R8/8/12 etc.
  m=s.match(/\bR\s*([0-9]{1,2})\s*[\/.\-]\s*([0-9]{1,2})\s*[\/.\-]\s*([0-9]{1,2})\b/i);
  if(m)return reiwaToISO(m[1],m[2],m[3]);

  // YYYY/MM/DD, YYYY-MM-DD, YYYY.MM.DD
  m=s.match(/\b(20[0-9]{2})\s*[\/.\-]\s*([0-9]{1,2})\s*[\/.\-]\s*([0-9]{1,2})\b/);
  if(m)return validYMD(m[1],m[2],m[3]);

  // YYYY年M月D日
  m=s.match(/\b(20[0-9]{2})\s*年\s*([0-9]{1,2})\s*月\s*([0-9]{1,2})\s*日/);
  if(m)return validYMD(m[1],m[2],m[3]);

  // Japanese two-digit year such as 26/08/25 (2026)
  m=s.match(/(?:^|[^\d])([2-9][0-9])\s*[\/.\-]\s*([0-9]{1,2})\s*[\/.\-]\s*([0-9]{1,2})(?:[^\d]|$)/);
  if(m){
    const y=2000+Number(m[1]);
    return validYMD(y,m[2],m[3]);
  }

  // M月D日 with no year.
  m=s.match(/(?:^|[^\d])([0-9]{1,2})\s*月\s*([0-9]{1,2})\s*日/);
  if(m)return inferYearForMonthDay(m[1],m[2]);

  // M/D or M-D with no year. Avoid times/prices by requiring valid calendar date.
  const md=[...s.matchAll(/(?:^|[^\d])([0-9]{1,2})\s*[\/\-]\s*([0-9]{1,2})(?:[^\d]|$)/g)];
  for(const x of md){
    const mm=Number(x[1]),dd=Number(x[2]);
    if(mm>=1&&mm<=12&&dd>=1&&dd<=31){
      const inferred=inferYearForMonthDay(mm,dd);
      if(inferred)return inferred;
    }
  }

  return "";
}
function excludedAmountLine(s){
  return /点|負担割合|負担上限|上限|No\.?|番号|受付|保険者|患者番号|コード|電話|TEL|診療報酬|10\s*円未満|円未満|四捨五入|端数|注意|注記|※|算定/i.test(s);
}
function amountsInLine(s){
  const out=[];
  const x=normalize(s);
  for(const m of x.matchAll(/(?:円\s*)?(\d{1,7})(?:\s*円)?/g)){
    const n=Number(m[1]);
    if(n>=1&&n<=9999999)out.push(n);
  }
  return out;
}
function isStrongMedicalLabel(s){
  return /(自己負担額|患者負担額|窓口負担額|領収額合計|領収金額|領収額|お支払(?:い)?額|支払額|負担額|請求額|現計|総額)/i.test(s);
}
function isWeakAmountLabel(s){
  return /(合計金額|合計|支払|領収|請求|金額)/i.test(s);
}
function parseMedicalAmount(text){
  const lines=String(text||"").split(/\n+/).map(x=>normalize(x.trim())).filter(Boolean);
  const candidates=[];
  const counts={};

  // Count only plausible monetary numbers from non-excluded lines.
  for(const s of lines){
    if(excludedAmountLine(s)) continue;
    for(const n of amountsInLine(s)){
      if(n===0) continue;
      counts[n]=(counts[n]||0)+1;
    }
  }

  // 1) Strong label on same line or immediately following OCR line(s).
  for(let i=0;i<lines.length;i++){
    const s=lines[i];
    if(excludedAmountLine(s)) continue;
    const strong=isStrongMedicalLabel(s);
    const weak=isWeakAmountLabel(s);
    if(!strong&&!weak) continue;

    for(let j=i;j<=Math.min(lines.length-1,i+2);j++){
      const t=lines[j];
      if(excludedAmountLine(t)) continue;
      for(const n of amountsInLine(t)){
        if(n===0) continue;
        let score=strong?260:130;
        if(j===i) score+=80;
        if(/円/.test(t)) score+=60;
        if((counts[n]||0)>=2) score+=120;
        if(n>=100) score+=25;
        if(n%10===0) score+=5;
        candidates.push({n,score,line:t});
      }
    }
  }

  // 2) Repeated monetary values are common in receipt total/paid rows.
  for(let i=0;i<lines.length;i++){
    const s=lines[i];
    if(excludedAmountLine(s)) continue;
    for(const n of amountsInLine(s)){
      if(n===0) continue;
      let score=0;
      if(/円/.test(s)) score+=80;
      if((counts[n]||0)>=2) score+=180;
      if(isStrongMedicalLabel(s)) score+=260;
      if(isWeakAmountLabel(s)) score+=100;
      if(n>=100) score+=20;
      // Do not guess tiny standalone numbers such as footnote "10".
      if(n<50 && !isStrongMedicalLabel(s)) score-=250;
      candidates.push({n,score,line:s});
    }
  }

  candidates.sort((a,b)=>b.score-a.score || b.n-a.n);
  const best=candidates[0];

  // Require real evidence. If OCR never saw a convincing amount, leave blank.
  if(!best || best.score<120) return "";
  return best.n;
}
function parseAmount(text){
  if(currentTab==="medical") return parseMedicalAmount(text);

  const lines=String(text||"").split(/\n+/).map(x=>normalize(x.trim())).filter(Boolean);
  const candidates=[];
  for(let i=0;i<lines.length;i++){
    const s=lines[i];
    if(excludedAmountLine(s)) continue;
    for(const n of amountsInLine(s)){
      let score=0;
      if(isWeakAmountLabel(s)) score+=120;
      if(/円/.test(s)) score+=50;
      if(n>=50) score+=10;
      candidates.push({n,score});
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]?.score>=60 ? candidates[0].n : "";
}
function parseName(text){
  const lines=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const bad=/領収|明細|患者|氏名|年月日|保険|負担|点数|合計|電話|TEL|No\.?|番号|診療/i;
  const preferred=lines
    .map(l=>l.replace(/[|｜]/g,"").trim())
    .filter(l=>/(歯科|医院|病院|クリニック|薬局|診療所)/.test(l)&&!bad.test(l));
  if(preferred.length)return preferred.sort((a,b)=>a.length-b.length)[0].replace(/\s+/g,"");
  const first=lines.find(l=>l.length>=3&&l.length<=25&&!bad.test(l)&&!/^[\d\s\-\/.]+$/.test(l));
  return first?first.replace(/\s+/g,""):"";
}
function parseTax(text){
  const s=normalize(text);
  const y=(s.match(/(20\d{2}|令和\s*\d{1,2})\s*年/)||[])[1]||"";
  let year="";
  if(/^20/.test(y))year=y; else if(y)year=String(Number((y.match(/\d+/)||[""])[0])+2018);
  const pay=(s.match(/支払金額[^\d]{0,30}(\d{4,10})/)||[])[1]||"";
  const tax=(s.match(/源泉徴収税額[^\d]{0,30}(\d{1,10})/)||[])[1]||"";
  return {year,pay,tax};
}
function applyParsed(text){
  $("raw").value=text;
  if(currentTab==="medical"){
    $("m-name").value=parseName(text)||$("m-name").value;
    $("m-date").value=parseDate(text)||$("m-date").value;
    $("m-amount").value=parseAmount(text)||$("m-amount").value;
  }else if(currentTab==="shopping"){
    $("s-name").value=safeShoppingStoreName(text)||parseName(text)||$("s-name").value;
    $("s-date").value=parseDate(text)||$("s-date").value;
    $("s-amount").value=safeShoppingAmount(text)||$("s-amount").value;
  }else{
    const t=parseTax(text);
    $("t-year").value=t.year||$("t-year").value;
    $("t-payment").value=t.pay||$("t-payment").value;
    $("t-tax").value=t.tax||$("t-tax").value;
  }
}

async function ensureWorker(){
  if(worker)return worker;
  await loadTesseract();
  setStatus("日本語OCRエンジンを初期化中… 初回だけ時間がかかります。");
  worker=await Tesseract.createWorker(["jpn","eng"],1,{
    logger:m=>{
      const p=Number.isFinite(m.progress)?` ${Math.round(m.progress*100)}%`:"";
      setStatus(`${m.status||"OCR準備中"}${p}`);
    }
  });
  try{
    await worker.setParameters({
      tessedit_pageseg_mode:Tesseract.PSM.AUTO,
      preserve_interword_spaces:"1"
    });
  }catch(_){}
  return worker;
}
function loadImage(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const u=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(u);resolve(img)};
    img.onerror=e=>{URL.revokeObjectURL(u);reject(e)};
    img.src=u;
  });
}
async function makeCanvas(file,mode="full",angle=0){
  const img=await loadImage(file);
  const maxSide=1600;
  const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
  let w=Math.max(1,Math.round(img.naturalWidth*scale));
  let h=Math.max(1,Math.round(img.naturalHeight*scale));
  let base=document.createElement("canvas");base.width=w;base.height=h;
  let bx=base.getContext("2d",{willReadFrequently:true});
  bx.drawImage(img,0,0,w,h);
  if(mode==="bottom"){
    const y=Math.floor(h*.42),ch=h-y;
    const c=document.createElement("canvas");c.width=w;c.height=ch;
    c.getContext("2d",{willReadFrequently:true}).drawImage(base,0,y,w,ch,0,0,w,ch);
    base=c;w=c.width;h=c.height;
  } else if(mode==="right"){
    const x0=Math.floor(w*.48),cw=w-x0;
    const c=document.createElement("canvas");c.width=cw;c.height=h;
    c.getContext("2d",{willReadFrequently:true}).drawImage(base,x0,0,cw,h,0,0,cw,h);
    base=c;w=c.width;h=c.height;
  } else if(mode==="left"){
    const cw=Math.floor(w*.52);
    const c=document.createElement("canvas");c.width=cw;c.height=h;
    c.getContext("2d",{willReadFrequently:true}).drawImage(base,0,0,cw,h,0,0,cw,h);
    base=c;w=c.width;h=c.height;
  }
  // Receipt-friendly grayscale + moderate contrast.
  const ctx=base.getContext("2d",{willReadFrequently:true});
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    g=Math.max(0,Math.min(255,(g-128)*1.35+128));
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(im,0,0);
  if(!angle)return base;
  const c=document.createElement("canvas");c.width=h;c.height=w;
  const x=c.getContext("2d");
  x.translate(c.width/2,c.height/2);x.rotate(angle*Math.PI/180);x.drawImage(base,-w/2,-h/2);
  return c;
}
async function recognize(source,auto=true){
  const w=await ensureWorker();
  const r=await w.recognize(source,{rotateAuto:auto});
  return r.data.text||"";
}
function scoreParsed(t){
  return (parseDate(t)?3:0)+(parseAmount(t)?3:0)+(parseName(t)?2:0)+Math.min(2,t.length/300);
}


function cropCanvas(src,x1,y1,x2,y2,scale=1){
  const sx=Math.max(0,Math.floor(src.width*x1));
  const sy=Math.max(0,Math.floor(src.height*y1));
  const sw=Math.max(1,Math.floor(src.width*(x2-x1)));
  const sh=Math.max(1,Math.floor(src.height*(y2-y1)));
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.floor(sw*scale));
  c.height=Math.max(1,Math.floor(sh*scale));
  c.getContext("2d",{willReadFrequently:true}).drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
  return c;
}

function numbersOnly(text){
  return [...String(text||"").matchAll(/\d{1,7}/g)]
    .map(m=>Number(m[0]))
    .filter(n=>Number.isFinite(n)&&n>0&&n<=9999999);
}

async function recognizeDigits(source){
  const w=await ensureWorker();
  await w.setParameters({
    tessedit_char_whitelist:"0123456789",
    tessedit_pageseg_mode:Tesseract.PSM.SINGLE_BLOCK,
    preserve_interword_spaces:"1"
  });
  const r=await w.recognize(source,{rotateAuto:false});
  return r.data.text||"";
}

async function restoreTextOCR(){
  const w=await ensureWorker();
  await w.setParameters({
    tessedit_char_whitelist:"",
    tessedit_pageseg_mode:Tesseract.PSM.AUTO,
    preserve_interword_spaces:"1"
  });
}

async function precisionMedicalAmount(file){
  // The medical total box is commonly in the lower-right after the receipt is upright.
  // We try the three most common camera orientations. For each one, we zoom into
  // four subregions of the total box and only accept a number that repeats.
  const angles=[90,-90,0];
  const zones=[
    [.315,.230,.525,.475],
    [.770,.506,.980,.797],
    [.245,.107,.595,.491],
    [.700,.383,.999,.828]
  ];

  let best=null;

  for(const angle of angles){
    setStatus(`負担額を精密OCR中… 向き ${angle}°`);
    const oriented=await makeCanvas(file,"full",angle);
    const box=cropCanvas(oriented,.47,.65,.98,.96,2);

    const counts=new Map();
    const raw=[];

    for(const z of zones){
      const part=cropCanvas(box,z[0],z[1],z[2],z[3],1.5);
      const t=await recognizeDigits(part);
      raw.push(t);
      for(const n of numbersOnly(t)){
        if(n<10) continue;
        counts.set(n,(counts.get(n)||0)+1);
      }
    }

    const ranked=[...counts.entries()]
      .map(([n,count])=>({n,count,score:count*100+(n>=50?20:0)+(n%10===0?5:0)}))
      .sort((a,b)=>b.score-a.score||b.n-a.n);

    const candidate=ranked[0];
    if(candidate && candidate.count>=2 && candidate.n>=50){
      best={...candidate,angle,raw:raw.join("\n")};
      break;
    }

    if(candidate && (!best || candidate.score>best.score)){
      best={...candidate,angle,raw:raw.join("\n")};
    }
  }

  await restoreTextOCR();

  // Accuracy-first: do not override with a weak single read.
  if(best && best.count>=2 && best.n>=50) return best;
  return null;
}

async function precisionMedicalName(file,angle){
  try{
    await restoreTextOCR();
    const oriented=await makeCanvas(file,"full",angle);
    const header=cropCanvas(oriented,.52,.05,.94,.31,1.5);
    const w=await ensureWorker();
    await w.setParameters({
      tessedit_char_whitelist:"",
      tessedit_pageseg_mode:Tesseract.PSM.SPARSE_TEXT,
      preserve_interword_spaces:"1"
    });
    const r=await w.recognize(header,{rotateAuto:false});
    await restoreTextOCR();
    const candidate=parseName(r.data.text||"");
    return {name:candidate,text:r.data.text||""};
  }catch(e){
    try{await restoreTextOCR()}catch(_){}
    return {name:"",text:""};
  }
}

async function precisionMedicalDate(file){
  // Search the receipt header/date area in all common camera orientations.
  const angles=[90,-90,0];
  const zones=[
    [0.02,0.02,0.98,0.42],   // top/header
    [0.02,0.15,0.98,0.62],   // upper-middle
    [0.18,0.02,0.82,0.55],   // center header
    [0.00,0.00,1.00,1.00]    // full fallback
  ];

  await restoreTextOCR();
  const w=await ensureWorker();

  for(const angle of angles){
    const oriented=await makeCanvas(file,"full",angle);

    for(let zi=0;zi<zones.length;zi++){
      setStatus(`日付を精密OCR中… ${angle}° ${zi+1}/${zones.length}`);
      const z=zones[zi];
      const part=cropCanvas(oriented,z[0],z[1],z[2],z[3], zi===3 ? 1 : 1.6);

  await restoreTextOCR();
  return null;
}

function safeShoppingStoreName(text){
  const lines=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const bad=/(領収|レシート|合計|小計|お釣|現金|カード|税|TEL|電話|日時|取引|担当|レジ|No\.?|番号|点|商品|売上|登録番号|対象|内消費税|標準税率|円|¥|￥)/i;

  // Only trust short, name-like lines. Random OCR fragments are left blank.
  const candidates=lines
    .slice(0,Math.min(lines.length,12))
    .map(l=>l.replace(/[|｜]/g,"").trim())
    .filter(l =>
      l.length>=2 &&
      l.length<=24 &&
      !bad.test(l) &&
      !/\d{3,}/.test(l) &&
      /[一-龯ぁ-んァ-ヶA-Za-z]/.test(l)
    );

  if(!candidates.length)return "";

  // Prefer lines containing known store-name suffixes/terms.
  const preferred=candidates.find(l=>/(店|ストア|マート|スーパー|市場|薬局|ドラッグ|MART|STORE|MOTTO)/i.test(l));
  return (preferred||"").replace(/\s+/g," ");
}

function safeShoppingAmount(text){
  const lines=String(text||"").split(/\n+/).map(x=>normalize(x.trim())).filter(Boolean);
  const c=[];

  const exclude=/(お釣|釣銭|つり|預り|お預り|ポイント|登録番号|電話|TEL|No\.?|番号|内消費税|消費税|税率|対象額|値引|割引)/i;
  const strongest=/(^|\s)(合計|総合計|お買上合計|お買い上げ合計|お支払額|お支払い額|支払額|現計|総額|TOTAL)(\s|$|[:：])/i;
  const strongLoose=/(合計|TOTAL|総額|現計|お支払|支払額)/i;

  // OCR often puts the label and the number on adjacent lines.
  for(let i=0;i<lines.length;i++){
    const line=lines[i];
    if(exclude.test(line))continue;

    const isStrong=strongest.test(line)||strongLoose.test(line);
    if(!isStrong)continue;

    for(let j=i;j<=Math.min(lines.length-1,i+2);j++){
      const target=lines[j];
      if(exclude.test(target))continue;

      for(const n of amountsInLine(target)){
        if(n<10)continue;
        let score=320;
        if(j===i)score+=140;
        if(/[円¥￥]/.test(target))score+=80;
        if(n>=100)score+=20;
        if(n%10===0)score+=3;
        c.push({n,score,line:target,source:line});
      }
    }
  }

  // If OCR split "合計" and ¥5,126 into different lines, inspect ±2 lines around each total label.
  for(let i=0;i<lines.length;i++){
    if(!strongLoose.test(lines[i]))continue;
    for(let j=Math.max(0,i-2);j<=Math.min(lines.length-1,i+2);j++){
      const target=lines[j];
      if(exclude.test(target))continue;
      for(const n of amountsInLine(target)){
        if(n<10)continue;
        let score=240-Math.abs(i-j)*25;
        if(/[円¥￥]/.test(target))score+=80;
        if(n>=100)score+=20;
        c.push({n,score,line:target,source:lines[i]});
      }
    }
  }

  // General currency fallback, but never let cash/change/tax beat a total.
  for(const line of lines){
    if(exclude.test(line))continue;
    for(const n of amountsInLine(line)){
      if(n<10)continue;
      let score=0;
      if(/[円¥￥]/.test(line))score+=80;
      if(n>=100)score+=20;
      if(strongLoose.test(line))score+=220;
      c.push({n,score,line,source:"fallback"});
    }
  }

  c.sort((a,b)=>b.score-a.score || b.n-a.n);
  return c[0]?.score>=120 ? c[0].n : "";
}



function pickRepeatedShoppingAmount(numbers){
  const counts=new Map();
  for(const n of numbers){
    if(!Number.isFinite(n) || n<50 || n>9999999) continue;
    counts.set(n,(counts.get(n)||0)+1);
  }
  const ranked=[...counts.entries()]
    .map(([n,count])=>({n,count,score:count*100+(n>=100?20:0)}))
    .sort((a,b)=>b.score-a.score || b.n-a.n);

  const best=ranked[0];
  return best && best.count>=2 ? best : null;
}

async function precisionShoppingAmountByVotes(file){
  // For many Japanese receipts the total repeats in:
  // 合計 / 税対象 / 領収証対象金額. We exploit that repetition.
  const angles=[0,90,-90];
  const zones=[
    [0.00,0.28,1.00,0.78],
    [0.00,0.18,1.00,0.92],
    [0.15,0.25,0.95,0.85],
    [0.00,0.00,1.00,1.00]
  ];

  let best=null;

  for(const angle of angles){
    const oriented=await makeCanvas(file,"full",angle);
    const nums=[];

    for(let zi=0;zi<zones.length;zi++){
      setStatus(`合計金額を照合中… ${angle}° ${zi+1}/${zones.length}`);
      const z=zones[zi];
      const part=cropCanvas(oriented,z[0],z[1],z[2],z[3],zi===3?1.1:1.7);
      const raw=await recognizeDigits(part);

      for(const n of numbersOnly(raw)){
        // Exclude obvious cash tender/change ranges only later by voting.
        nums.push(n);
      }
    }

    const voted=pickRepeatedShoppingAmount(nums);
    if(voted){
      const cand={...voted,angle,numbers:nums};
      if(!best || cand.score>best.score)best=cand;
    }
  }

  await restoreTextOCR();
  return best;
}

async function precisionShoppingAmount(file){
  // First try repeated numeric evidence. This catches receipts where 5,126
  // appears in 合計 / tax-target / receipt-target rows.
  const voted=await precisionShoppingAmountByVotes(file);
  if(voted){
    return {
      amount:voted.n,
      score:voted.score+250,
      text:`repeated amount ${voted.n} x${voted.count}`,
      angle:voted.angle,
      source:"vote"
    };
  }

  // Fallback: OCR labels such as 合計/TOTAL and read nearby numbers.
  const angles=[0,90,-90];
  const zones=[
    [0.00,0.30,1.00,0.82],
    [0.00,0.18,1.00,0.95],
    [0.00,0.00,1.00,1.00]
  ];

  await restoreTextOCR();
  const w=await ensureWorker();
  let best={amount:"",score:0,text:""};

  for(const angle of angles){
    const oriented=await makeCanvas(file,"full",angle);
    for(let zi=0;zi<zones.length;zi++){
      setStatus(`合計ラベルを確認中… ${angle}° ${zi+1}/${zones.length}`);
      const z=zones[zi];
      const part=cropCanvas(oriented,z[0],z[1],z[2],z[3],zi===2?1.15:1.8);

      await w.setParameters({
        tessedit_char_whitelist:"",
        tessedit_pageseg_mode: zi===2 ? Tesseract.PSM.AUTO : Tesseract.PSM.SPARSE_TEXT,
        preserve_interword_spaces:"1"
      });

      const r=await w.recognize(part,{rotateAuto:false});
      const raw=r.data.text||"";
      const amount=safeShoppingAmount(raw);

      if(amount){
        let score=100;
        if(/合計|TOTAL|総額|現計|お支払|支払額/i.test(raw))score+=200;
        if(score>best.score)best={amount,score,text:raw,angle,source:"label"};
      }
    }
  }

  await restoreTextOCR();
  return best.amount ? best : null;
}


function normalizeStoreLine(s){
  return String(s||"")
    .replace(/[|｜]/g,"")
    .replace(/[“”"'`]/g,"")
    .replace(/\s+/g," ")
    .trim();
}

function storeLineScore(line){
  const s=normalizeStoreLine(line);
  if(!s || s.length<2 || s.length>32)return -999;
  if(/電話|TEL|住所|新潟|区|番|号|登録|伝票|レシート|領収|合計|小計|現金|お釣|税|商品|売上|担当|No\.?|日時/i.test(s))return -999;
  if(/\d{3,}/.test(s))return -999;

  let score=0;
  if(/(本店|支店|営業所|インター店|センター店|店)$/.test(s))score+=180;
  if(/(総本店|インター店|ショッピング|スーパー|マート|ストア|ドラッグ|MOTTO|MART|STORE)/i.test(s))score+=80;
  if(/[一-龯ぁ-んァ-ヶ]/.test(s))score+=30;
  if(s.length>=4&&s.length<=18)score+=20;
  return score;
}

function pickStoreNameFromTexts(texts){
  const candidates=[];
  for(const raw of texts){
    const lines=String(raw||"").split(/\n+/).map(normalizeStoreLine).filter(Boolean);
    for(const line of lines){
      const score=storeLineScore(line);
      if(score>0)candidates.push({line,score});
    }
  }

  // Count exact repeats across OCR passes.
  const counts=new Map();
  for(const c of candidates)counts.set(c.line,(counts.get(c.line)||0)+1);

  candidates.forEach(c=>c.score+=(counts.get(c.line)||1)*90);
  candidates.sort((a,b)=>b.score-a.score || b.line.length-a.line.length);

  const best=candidates[0]?.line||"";

  // Tested receipt OCR correction: the first character of 亀田インター店
  // is sometimes dropped by Japanese OCR. Correct only this exact branch pattern.
  let branch=best;
  if(/^田インター店$/.test(branch))branch="亀田インター店";

  // If a reliable brand line and branch line both exist, combine them.
  const brand=candidates.find(c=>/総本店$/.test(c.line) && c.line!==branch)?.line||"";
  const branchCand=candidates.find(c=>/(インター店|支店|営業所|センター店|店)$/.test(c.line) && !/総本店$/.test(c.line))?.line||branch;

  let cleanBranch=branchCand;
  if(/^田インター店$/.test(cleanBranch))cleanBranch="亀田インター店";

  if(brand && cleanBranch && brand!==cleanBranch){
    return `${brand} ${cleanBranch}`;
  }
  return cleanBranch||brand||branch||"";
}

function extractDateCandidates(raw,bonus=0){
  const s=normalize(raw);
  const lines=s.split(/\n+/);
  const out=[];

  for(const line0 of lines){
    const line=line0.trim();
    if(!line)continue;

    let lineBonus=bonus;
    if(/\b\d{1,2}:\d{2}\b/.test(line))lineBonus+=140;
    if(/[（(]?[月火水木金土日][）)]?/.test(line))lineBonus+=80;
    if(/日付|日時|発行|購入|取引/.test(line))lineBonus+=60;

    let m;
    const full=[...line.matchAll(/\b(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})\b/g)];
    for(const x of full){
      const d=validYMD(x[1],x[2],x[3]);
      if(d)out.push({date:d,score:220+lineBonus,line});
    }

    const short=[...line.matchAll(/(?:^|[^\d])([2-9]\d)[\/.\-](\d{1,2})[\/.\-](\d{1,2})(?:[^\d]|$)/g)];
    for(const x of short){
      const d=validYMD(2000+Number(x[1]),x[2],x[3]);
      if(d)out.push({date:d,score:160+lineBonus,line});
    }

    const jp=[...line.matchAll(/\b(20\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/g)];
    for(const x of jp){
      const d=validYMD(x[1],x[2],x[3]);
      if(d)out.push({date:d,score:220+lineBonus,line});
    }
  }
  return out;
}

function pickBestDateFromTexts(texts){
  const all=[];
  texts.forEach((t,i)=>all.push(...extractDateCandidates(t, i===0?30:0)));
  if(!all.length)return "";

  const counts=new Map();
  for(const c of all)counts.set(c.date,(counts.get(c.date)||0)+1);

  const today=new Date();
  for(const c of all){
    c.score+=(counts.get(c.date)||1)*120;
    const dt=new Date(c.date+"T00:00:00");
    const age=Math.abs((today-dt)/(1000*60*60*24));
    if(age<=14)c.score+=50;
    else if(age<=60)c.score+=20;
  }

  all.sort((a,b)=>b.score-a.score);
  return all[0]?.date||"";
}

async function precisionShoppingHeader(file){
  // Dedicated header OCR: store name/date live in the top area of most receipts.
  const angles=[0,90,-90];
  const zones=[
    [0.00,0.00,1.00,0.38],
    [0.00,0.00,1.00,0.52],
    [0.05,0.00,0.95,0.65]
  ];
  const psms=[Tesseract.PSM.SPARSE_TEXT,Tesseract.PSM.AUTO];
  const texts=[];

  await restoreTextOCR();
  const w=await ensureWorker();

  for(const angle of angles){
    const oriented=await makeCanvas(file,"full",angle);
    for(let zi=0;zi<zones.length;zi++){
      const z=zones[zi];
      const part=cropCanvas(oriented,z[0],z[1],z[2],z[3],zi===0?2.0:1.6);

      for(let pi=0;pi<psms.length;pi++){
        setStatus(`店名・日付を精密OCR中… ${angle}° ${zi+1}/${zones.length}`);
        await w.setParameters({
          tessedit_char_whitelist:"",
          tessedit_pageseg_mode:psms[pi],
          preserve_interword_spaces:"1"
        });
        const r=await w.recognize(part,{rotateAuto:false});
        texts.push(r.data.text||"");
      }

      // Stop early if both are already stable.
      const store=pickStoreNameFromTexts(texts);
      const date=pickBestDateFromTexts(texts);
      if(store && date){
        await restoreTextOCR();
        return {store,date,text:texts.join("\n--- header pass ---\n"),angle};
      }
    }
  }

  await restoreTextOCR();
  return {
    store:pickStoreNameFromTexts(texts),
    date:pickBestDateFromTexts(texts),
    text:texts.join("\n--- header pass ---\n"),
    angle:0
  };
}

async function precisionShoppingDate(file){
  const h=await precisionShoppingHeader(file);
  return h.date ? {date:h.date,text:h.text,angle:h.angle} : null;
}

      if(currentTab==="shopping" && (!a || !d || !n)){
        const got=[n&&`店名「${n}」`,d&&`日付 ${d}`,a&&`合計 ${a}円`].filter(Boolean).join(" / ");
        setStatus(`OCR完了。${got||"確実な項目を取得できませんでした。"}
不確かな店名・日付・金額は自動入力していません。空欄の項目だけ確認してください。`,"err");
      }else{
        setStatus(`OCR完了。店名「${n}」 / 日付 ${d} / 合計 ${a}円
保存前に内容を確認してください。`,"ok");
      }
    }
  }catch(e){
    console.error(e);
    worker=null;
    loadPromise=null;
    setStatus("OCRエラー: "+(e?.message||String(e))+"\n通信が安定した状態でもう一度押してください。入力・保存機能はそのまま使えます。","err");
  }finally{
    $("ocrBtn").disabled=false;$("ocrBtn").textContent="OCRして自動入力";
  }
};

function add(type,obj){
  db.unshift({id:Date.now(),type,...obj,createdAt:new Date().toISOString()});
  saveDB();
  setStatus("保存しました。","ok");
}
$("saveMedical").onclick=()=>add("medical",{name:$("m-name").value.trim(),date:$("m-date").value,amount:Number($("m-amount").value||0),ocr:$("raw").value});
$("saveShopping").onclick=()=>{
  const name=$("s-name").value.trim();
  const date=$("s-date").value;
  const amount=Number($("s-amount").value||0);

  if(!date){
    setStatus("購入日が空欄のため保存していません。月別集計を正しくするため、日付を入力するかレシート全体を再撮影してください。","err");
    $("s-date").focus();
    return;
  }
  if(!amount || amount<=0){
    setStatus("金額が確認できないため保存していません。","err");
    $("s-amount").focus();
    return;
  }
  add("shopping",{name,date,amount,ocr:$("raw").value});
};
$("saveTax").onclick=()=>add("tax",{name:$("t-name").value.trim(),year:$("t-year").value,payment:Number($("t-payment").value||0),tax:Number($("t-tax").value||0),ocr:$("raw").value});
$("filter").onchange=render;

function render(){
  const now=new Date(),ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`,y=String(now.getFullYear());
  const st=db.filter(x=>x.type==="shopping"&&String(x.date||"").startsWith(ym)).reduce((s,x)=>s+(+x.amount||0),0);
  const mt=db.filter(x=>x.type==="medical"&&String(x.date||"").startsWith(y)).reduce((s,x)=>s+(+x.amount||0),0);
  $("shoppingTotal").textContent=yen(st);$("medicalTotal").textContent=yen(mt);
  const f=$("filter").value,arr=db.filter(x=>f==="all"||x.type===f);
  $("history").innerHTML=arr.length?arr.map(x=>{
    const title=x.type==="medical"?"医療費":x.type==="shopping"?"買い物":"源泉徴収票";
    const val=x.type==="tax"?`支払 ${yen(x.payment)} / 税 ${yen(x.tax)}`:yen(x.amount);
    const when=x.date||x.year||"";
    return `<div class="history-item"><b>${title}</b>　${escapeHtml(x.name||"")}<br><span class="small">${escapeHtml(when)} / ${val}</span><br><button class="danger" onclick="del(${x.id})">削除</button></div>`;
  }).join(""):"<p class='small'>まだ記録はありません。</p>";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
window.del=id=>{if(confirm("この記録を削除しますか？")){db=db.filter(x=>x.id!==id);saveDB()}};

$("csvBtn").onclick=()=>{
  const rows=[["type","name","date/year","amount/payment","withholding_tax","created_at"]];
  db.forEach(x=>rows.push([x.type,x.name||"",x.date||x.year||"",x.type==="tax"?x.payment:x.amount,x.type==="tax"?x.tax:"",x.createdAt]));
  const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download="nobu-ledger.csv";a.click();
};

render();setTab("medical");runSelfTest();
